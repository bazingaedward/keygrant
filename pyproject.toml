[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keygrant"
version = "0.1.2"
description = "Per-command secret injection for AI coding agents — values never enter model context"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["secrets", "mcp", "ai-agents", "claude-code", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
cloud = ["pynacl>=1.5"]

[project.urls]
Homepage = "https://keygrant.app"
Repository = "https://github.com/bazingaedward/keygrant"

[project.scripts]
keygrant = "keygrant:main"
keygrant-mcp = "keygrant_mcp:main"

[tool.setuptools]
py-modules = ["keygrant", "keygrant_mcp", "keygrant_cloud"]
